<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gomoku</title>
  <link rel="stylesheet" href="../../shared/common.css">
  <link rel="stylesheet" href="../../shared/board.css">
</head>
<body>
  <main>
    <a class="back" href="../../index.html">← Game Hub</a>
    <h1>Gomoku</h1>
    <div class="controls">
      <select id="mode" aria-label="Game mode">
        <option value="2p">2 Players</option>
        <option value="easy">vs Computer (Easy)</option>
        <option value="hard">vs Computer (Hard)</option>
      </select>
      <button id="theme" class="ghost-btn">🎨 Theme</button>
      <button id="sound" class="ghost-btn">🔊</button>
    </div>
    <div id="scores"></div>
    <p id="status"></p>
    <div id="board" class="gb"></div>
    <button id="restart" class="primary">New Game</button>
  </main>
  <script src="../../shared/common.js"></script>
  <script src="../../shared/board.js"></script>
  <script src="script.js"></script>
</body>
</html>
